version: 2

models:
  - name: fct_ebay_listings
    description: >
      Final table ready for price modeling 
    columns:
      - name: item_id
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null
      - name: risk_category
        description: "Risk level category: High Risk, Medium Risk, or Low Risk"
        tests:
          - accepted_values:
              arguments:
                values: ['High Risk', 'Low Risk']
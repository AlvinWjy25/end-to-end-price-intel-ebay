version: 2

models:
  - name: fct_ebay_listings
    description: >
      Final table ready for price modeling 
    columns:
      - name: item_id
        description: "Unique ID item from eBay"
      - name: title
        description: "Title listing product"
      - name: currency
        description: "Currency of listing"    
      - name: condition
        description: "Condition of product"
      - name: seller_location
        description: "Location of seller"
      - name: is_boxset
        description: "Boolean value indicating if the listing is a boxset or not"
      - name: is_special_edition
        description: "Boolean value indicating if the listing is a special edition"
      - name: is_first_print
        description: "Boolean value indicating if the listing is a first print"
      - name: has_signature
        description: "Boolean value indicating if the listing has author's signature such as: sign, signed, autograph, autographed, 直筆サイン"
      - name: has_merch
        description: "Boolean value indicating if the listing has merch such as: tapestry, standee, acrylic, figure, bonus"
      - name: has_paper_extra
        description: "Boolean value indicating if the listing has extra paper such as: obi, booklet, drama cd, clear file"
      - name: total_bonus_count
        description: "integer value summing all of special edition bonus quantity and volume with signature"
      - name: boxset_side_story_edition_included
        description: "Boolean value indicating if the listing is a boxset with side story edition included"
      - name: standalone_side_story_edition
        description: "Boolean value indicating if the listing is a standalone with side story edition included"
      - name: price
        description: "Price"
      - name: price_per_volume
        description: "Price divided by volume number"
      - name: volume_number
        description: "Volume number"
      - name: volume_number_end
        description: "Last volume number in a box-set"
      - name: text_risk_score
        description: "Accumulated risk score from text anomalies (older version)"
      - name: text_risk_score_v2
        description: "Updated text_risk_score for better classification (02_EDA.ipynb & 02_EDA_unsupervised.ipynb)"
      - name: risk_category
        description: "Risk level category: High Risk, Medium Risk, or Low Risk"
        tests:
          - accepted_values:
              arguments:
                values: ['High Risk', 'Low Risk']
      - name: volume_confidence
        description: 'Classification confidence level of the volume number extraction based on Tiering Workflow'
        tests:
          - accepted_values:
              arguments:
              values: ['low', 'medium', 'high']
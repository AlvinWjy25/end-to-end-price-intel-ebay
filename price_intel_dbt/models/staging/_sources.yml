version: 2

sources:
  - name: raw
    database: price_intelligence  
    schema: raw                   
    tables:
      - name: ebay_listings
        description: "Raw data from ebay_api"
        columns:
          - name: item_id
            description: "Unique ID item from eBay"
          - name: price
            description: "Price"
          - name: title
            description: "Title listing product"  
          - name: currency
            description: "Currency of listing"
          - name: condition
            description: "Condition of product"
          - name: seller_location
            description: "Location of seller"
          - name: description
            description: "Description of product provided by seller"
          - name: localized_aspects
            description: "A JSON formatted metadata description of light novel 
                          based on ebay format, containing key details about the book such as:
                            - aspect_issue_number, Volume number or range (inconsistent format, needs REGEXP pattern handling)
                            - aspect_book_title, Prioritize using localized_aspects based title compared to product title
                            - aspect_unit_of_sale = individual / set, inconsistent across listing"           
          - name: fetched_at
            description: "Timestamp when data was fetched"
          - name: is_boxset
            description: "Boolean indicating whether the listing is a boxset or not
                          based on range provided from title"